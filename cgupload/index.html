<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>ODDCITY</title>
<!-- CrazyGames build (BuildTools.BuildCrazyGames): CrazyGames SDK v3 for ads + loading/gameplay events. No outside links,
     no other ads or analytics (portal rules). WebAds.cs talks to window.oddcityAds below through OddcityWeb.jslib. -->
<script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
<style>
  @font-face { font-family: Barlow; font-weight: 700; src: url("TemplateData/barlow-700.woff") format("woff"); font-display: swap; }
  :root { --bg: #0b0e22; --aqua: #36d6c7; --yellow: #ffd166; --dim: #c9d2e3; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; font-family: Barlow, system-ui, sans-serif; }
  #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: var(--bg); outline: none; }
  #loader { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 22px; padding: 16px; text-align: center;
    background: radial-gradient(ellipse at 50% 40%, #241c5c 0%, var(--bg) 70%); transition: opacity .5s; }
  #loader.done { opacity: 0; pointer-events: none; }
  .logo { font-size: clamp(48px, 11vw, 112px); font-weight: 700; letter-spacing: .03em; line-height: 1; }
  .logo b { color: var(--aqua); text-shadow: 0 0 30px rgb(54 214 199 / .6); }
  .tag { color: var(--yellow); letter-spacing: .3em; font-size: clamp(12px, 2vw, 18px); font-weight: 700; }
  .bar { width: min(420px, 80vw); height: 12px; border-radius: 99px; background: rgb(255 255 255 / .12); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, var(--aqua), var(--yellow)); transition: width .2s; }
  #msg { color: var(--dim); font-size: 16px; max-width: 520px; line-height: 1.5; margin: 0; }
  #rotate { position: fixed; inset: 0; z-index: 9; display: none; place-content: center; text-align: center; gap: 14px; background: var(--bg); padding: 24px; font-size: 22px; }
  #rotate span { font-size: 64px; display: block; animation: turn 1.6s ease-in-out infinite; }
  @keyframes turn { 50% { transform: rotate(-90deg); } }
  @media (orientation: portrait) and (max-width: 900px) { #rotate { display: grid; } }
</style>
</head>
<body>
<canvas id="unity-canvas" tabindex="-1"></canvas>
<div id="loader">
  <div class="logo"><b>ODD</b>CITY</div>
  <div class="tag">EVERYONE HAS A SECRET</div>
  <div class="bar"><i id="fill"></i></div>
  <p id="msg">Loading the city&hellip;</p>
</div>
<div id="rotate"><span aria-hidden="true">&#x1F4F1;</span>Turn your phone sideways to play</div>
<script>
  const canvas = document.querySelector("#unity-canvas");
  const fill = document.querySelector("#fill"), msg = document.querySelector("#msg"), loader = document.querySelector("#loader");
  const mobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  const sdk = () => window.CrazyGames && window.CrazyGames.SDK;
  const sdkReady = (async () => { try { if (sdk()) await sdk().init(); return !!sdk(); } catch (e) { return false; } })();

  // Ads for WebAds.cs: "reward" = rewarded video, done(true) only when it finished; "next" = between-match (midgame) ad.
  window.oddcityAds = {
    ready: true,
    show(kind, done) {
      let over = false;
      const end = (ok) => { if (!over) { over = true; done(ok); } };
      sdkReady.then((ok) => {
        if (!ok) { end(false); return; }
        try {
          sdk().ad.requestAd(kind === "reward" ? "rewarded" : "midgame", {
            adStarted: () => {},
            adFinished: () => end(true),
            adError: () => end(kind !== "reward"),
          });
        } catch (e) { end(kind !== "reward"); }
      });
      setTimeout(() => end(false), 90000);   // never leave the game paused
    },
  };
  window.oddcityTrack = () => {};

  const config = {
    arguments: [],
    dataUrl: "Build/1772b0d94c5eda5d6fa4f974c407a0c9.data.unityweb",
    frameworkUrl: "Build/bace5353a98b9ba1bc38ade5e3cd3445.framework.js.unityweb",
    codeUrl: "Build/a68613a3cbfde2fa5c6af3a1d6dbeb56.wasm.unityweb",
    streamingAssetsUrl: "StreamingAssets",
    companyName: "OddCity Studio",
    productName: "ODDCITY",
    productVersion: "1.0.0",
    devicePixelRatio: mobile ? 1 : Math.min(window.devicePixelRatio || 1, 1.5),
  };
  sdkReady.then((ok) => { if (ok) try { sdk().game.loadingStart(); } catch (e) {} });
  const script = document.createElement("script");
  script.src = "Build/7e745fed2d2e825d03914395b42a8069.loader.js";
  script.onload = () => {
    createUnityInstance(canvas, config, (p) => { fill.style.width = Math.round(p * 100) + "%"; })
      .then((instance) => {
        window.unityInstance = instance; loader.classList.add("done"); setTimeout(() => loader.remove(), 600); canvas.focus();
        sdkReady.then((ok) => { if (ok) try { sdk().game.loadingStop(); sdk().game.gameplayStart(); } catch (e) {} });
      })
      .catch((e) => { msg.textContent = "Sorry, ODDCITY couldn't start in this browser (" + String(e).slice(0, 120) + "). Try the latest Chrome, Edge or Firefox."; });
  };
  document.body.appendChild(script);
</script>
</body>
</html>
